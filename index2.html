<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>wgchen</title>
    <link rel="shortcut icon" href="#" />
    <meta name="keywords" content="https://wgchen.blog.csdn.net">
    <meta name="keywords" content="技术文章">
    <meta name="keywords" content="博客">
    <meta name="keywords" content="willem">
    <meta name="keywords" content="ycc">
    <style>
        body {
            display: grid;
            grid-auto-flow: column;
            grid-gap: 8vw;
            place-content: center;
            margin: 0;
            height: 100vh;
            background: #ecf0f4;
        }

        button {
            --i: var(--light, 0);
            --not-i: calc(1 - var(--i));
            --j: var(--press, 0);
            --not-j: calc(1 - var(--j));
            z-index: var(--i);
            border: none;
            padding: 0.5em 4em; /* 调整按钮长度 */
            border-radius: 0; /* 去掉圆角 */
            transform: scale(calc(1 - var(--j)*.02));
            box-shadow: 
                calc(var(--not-j)*-0.25em) calc(var(--not-j)*-0.25em) 0.5em rgba(252, 252, 252, var(--not-j)), 
                calc(var(--not-j)*0.25em) calc(var(--not-j)*0.25em) 0.5em rgba(210, 218, 230, var(--not-j)), 
                inset calc(var(--j)*0.25em) calc(var(--j)*0.25em) 0.5em rgba(210, 218, 230, var(--j)), 
                inset calc(var(--j)*-0.25em) calc(var(--j)*-0.25em) 0.5em rgba(252, 252, 252, var(--j));
            background: linear-gradient(90deg, #03a9f4, #f441a5, #ffeb3b, #03a9f4);
            background-size: 400%;
            font-size: 1.5em;
            transition: box-shadow 0.3s, transform 0.3s cubic-bezier(0.2, 4, 1, 3);
            cursor: pointer;
            color: #fff;
            font-family: 'Arial', sans-serif; /* 调整字体 */
            position: relative;
            overflow: hidden;
            text-shadow: 0 0 5px white, 0 0 5px white; /* 添加文字发光效果 */
            animation: animate 8s linear infinite;
            transform: skew(-20deg); /* 调整为菱形 */
        }

        @keyframes animate {
            0% {
                background-position: 0%;
            }
            100% {
                background-position: 400%;
            }
        }

        button::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            z-index: -1;
            background: linear-gradient(90deg, #03a9f4, #f441a5, #ffeb3b, #03a9f4);
            background-size: 400%;
            border-radius: 0; /* 去掉圆角 */
            opacity: 1;
            filter: blur(20px);
            animation: animate 8s linear infinite;
            transform: skew(-20deg); /* 调整为菱形 */
        }

        button::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid white;
            animation: move 4s linear infinite;
            transform: skew(-20deg); /* 调整为菱形 */
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }

        @keyframes move {
            0% {
                clip-path: polygon(0 0, 100% 0, 100% 0, 0 0);
            }
            25% {
                clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            }
            50% {
                clip-path: polygon(100% 0, 100% 100%, 0 100%, 0 0);
            }
            75% {
                clip-path: polygon(100% 100%, 0 100%, 0 0, 100% 0);
            }
            100% {
                clip-path: polygon(0 100%, 0 0, 100% 0, 100% 100%);
            }
        }

        button:focus {
            outline: none;
        }

        button:hover,
        button:focus {
            --light: 1;
        }

        button:active {
            --press: 1;
        }

        button span {
            display: inline-block;
            transform: skew(20deg); /* 文字反向倾斜 */
        }

        .line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid white;
            animation: move2 4s linear infinite;
            transform: skew(-20deg); /* 调整为菱形 */
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }

        @keyframes move2 {
            0% {
                clip-path: polygon(0 0, 0 0, 0 0, 0 0);
            }
            25% {
                clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            }
            50% {
                clip-path: polygon(100% 0, 100% 100%, 0 100%, 0 0);
            }
            75% {
                clip-path: polygon(100% 100%, 0 100%, 0 0, 100% 0);
            }
            100% {
                clip-path: polygon(0 100%, 0 0, 100% 0, 100% 100%);
            }
        }

        .glow {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            z-index: -2;
            background: linear-gradient(90deg, #03a9f4, #f441a5, #ffeb3b, #03a9f4);
            background-size: 400%;
            border-radius: 0; /* 去掉圆角 */
            opacity: 0.8;
            filter: blur(40px);
            animation: animate 8s linear infinite;
            transform: skew(-20deg); /* 调整为菱形 */
        }
    </style>
</head>

<body>

    <button aria-label="我的小屋"><span>我的小屋</span><div class="line"></div><div class="glow"></div></button>

</body>

</html>
